<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 845" role="img" aria-labelledby="title desc"><title id="title">PID: เริ่มรักษาเมื่อเข้าเกณฑ์ แล้วติดตามการตอบสนอง</title><desc id="desc">ต้องครอบคลุม GC/Chlamydia แม้ผลตรวจจากปากมดลูกเป็นลบ</desc><rect width="1120" height="845" rx="20" fill="#f2f7fb"/><g font-family="Tahoma, Leelawadee UI, sans-serif"><text x="42" y="54" font-size="16" font-weight="700" fill="#526e85"><tspan x="42" dy="0">ASSESS → OPD / ADMIT → REASSESS</tspan></text><text x="42" y="96" font-size="30" font-weight="700" fill="#123d60"><tspan x="42" dy="0">PID: เริ่มรักษาเมื่อเข้าเกณฑ์ แล้วติดตามการตอบสนอง</tspan></text><path d="M42 154 H1078" stroke="#d5e1eb"/><rect x="42.0" y="182" width="1036.0" height="128" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 183 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="218" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">Pelvic pain + pelvic tenderness</tspan></text><text x="62.0" y="262" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ตัดภาวะฉุกเฉิน/ตั้งครรภ์นอกมดลูก; ตรวจ pregnancy test, STI และพิจารณา ultrasound</tspan></text><path d="M560 310 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="345" width="507.0" height="162" rx="13" fill="#fff8f5" stroke="#dce7ee"/><path d="M57.0 346 H534.0" stroke="#bf5145" stroke-width="4"/><text x="62.0" y="381" font-size="24" font-weight="700" fill="#933d33"><tspan x="62.0" dy="0">Admit / ประเมินเร่งด่วน</tspan></text><text x="62.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ตั้งครรภ์, TOA, อาการรุนแรง, กินยาไม่ได้, แยก</tspan><tspan x="62.0" dy="34">surgical emergency ไม่ได้ หรือ OPD ไม่ดีขึ้น</tspan></text><rect x="571.0" y="345" width="507.0" height="162" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M586.0 346 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="591.0" y="381" font-size="24" font-weight="700" fill="#17466b"><tspan x="591.0" dy="0">เหมาะกับ OPD</tspan></text><text x="591.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="591.0" dy="0">Ceftriaxone IM ครั้งเดียว + doxycycline +</tspan><tspan x="591.0" dy="34">metronidazole รวม 14 วัน ตามตารางขนาดยา</tspan></text><path d="M560 507 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="542" width="507.0" height="162" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 543 H534.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="578" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">ทบทวนภายใน 72 ชั่วโมง</tspan></text><text x="62.0" y="622" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">หากไม่ดีขึ้น ให้ประเมิน diagnosis, adherence,</tspan><tspan x="62.0" dy="34">TOA และการรับไว้รักษา</tspan></text><rect x="571.0" y="542" width="507.0" height="162" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M586.0 543 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="591.0" y="578" font-size="24" font-weight="700" fill="#17466b"><tspan x="591.0" dy="0">ป้องกันติดเชื้อซ้ำ</tspan></text><text x="591.0" y="622" font-size="22" font-weight="400" fill="#344d61"><tspan x="591.0" dy="0">ประเมิน/รักษาคู่นอน งดเพศสัมพันธ์จนรักษาครบและ</tspan><tspan x="591.0" dy="34">อาการหาย ไม่ถอด IUD ทุกรายเป็นกิจวัตร</tspan></text><text x="42" y="738" font-size="18" font-weight="400" fill="#4b6477"><tspan x="42" dy="0">ต้องครอบคลุม GC/Chlamydia แม้ผลตรวจจากปากมดลูกเป็นลบ</tspan></text><a href="https://www.cdc.gov/std/treatment-guidelines/pid.htm"><text x="42" y="785" font-size="16" font-weight="400" fill="#2e74b5"><tspan x="42" dy="0">CDC: Pelvic inflammatory disease</tspan></text></a><text x="42" y="811" font-size="16" font-weight="400" fill="#526e85"><tspan x="42" dy="0">Teaching revision · 4 October 2026 | OB-GYN Pocketbook · Phichit Hospital</tspan></text></g></svg>