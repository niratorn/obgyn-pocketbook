<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 995" role="img" aria-labelledby="title desc"><title id="title">หลังคลอด: แยกชนิดเบาหวานก่อนเปลี่ยนยา</title><desc id="desc">A1 = คุมด้วยอาหาร/กิจกรรม | A2 = ต้องใช้ยา ไม่แบ่งด้วย FBS ค่าเดียว</desc><rect width="1120" height="995" rx="20" fill="#f2f7fb"/><g font-family="Tahoma, Leelawadee UI, sans-serif"><text x="42" y="54" font-size="16" font-weight="700" fill="#526e85"><tspan x="42" dy="0">GDM ≠ TYPE 1 ≠ TYPE 2</tspan></text><text x="42" y="96" font-size="30" font-weight="700" fill="#123d60"><tspan x="42" dy="0">หลังคลอด: แยกชนิดเบาหวานก่อนเปลี่ยนยา</tspan></text><path d="M42 154 H1078" stroke="#d5e1eb"/><rect x="42.0" y="182" width="1036.0" height="128" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 183 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="218" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">คลอดแล้ว: ทบทวน diagnosis และแผนยาเดิม</tspan></text><text x="62.0" y="262" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ความต้องการ insulin ลดลงหลังคลอด ต้องติดตาม glucose และ hypoglycemia โดยเฉพาะระหว่างให้นม</tspan></text><path d="M560 310 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="345" width="507.0" height="196" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 346 H534.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="381" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">GDM</tspan></text><text x="62.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">มักหยุดยาลดน้ำตาลหลังคลอด</tspan><tspan x="62.0" dy="34">ตรวจระดับน้ำตาลและนัด 75 g OGTT ที่ 4-12</tspan><tspan x="62.0" dy="34">สัปดาห์</tspan></text><rect x="571.0" y="345" width="507.0" height="196" rx="13" fill="#fff8f5" stroke="#dce7ee"/><path d="M586.0 346 H1063.0" stroke="#bf5145" stroke-width="4"/><text x="591.0" y="381" font-size="24" font-weight="700" fill="#933d33"><tspan x="591.0" dy="0">Pre-existing type 1</tspan></text><text x="591.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="591.0" dy="0">ยังต้องได้รับ insulin: ปรับขนาดกับทีมรักษา</tspan><tspan x="591.0" dy="34">ห้ามสั่งหยุดแล้วเปลี่ยนเป็นยากิน</tspan></text><rect x="42.0" y="563" width="1036.0" height="128" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 564 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="599" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">Pre-existing type 2</tspan></text><text x="62.0" y="643" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ปรับ insulin/ยากินตาม glucose, renal function และ breastfeeding ไม่ใช้คำสั่งเดียวกับ GDM</tspan></text><path d="M560 691 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="726" width="1036.0" height="128" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 727 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="762" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">ติดตามต่อเนื่อง</tspan></text><text x="62.0" y="806" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">แจ้งผลและแผนส่งต่อคลินิกเบาหวาน; หาก GDM ผลหลังคลอดปกติ ยังต้องคัดกรองระยะยาว</tspan></text><text x="42" y="888" font-size="18" font-weight="400" fill="#4b6477"><tspan x="42" dy="0">A1 = คุมด้วยอาหาร/กิจกรรม | A2 = ต้องใช้ยา ไม่แบ่งด้วย FBS ค่าเดียว</tspan></text><a href="https://www.nice.org.uk/guidance/NG3/chapter/recommendations"><text x="42" y="935" font-size="16" font-weight="400" fill="#2e74b5"><tspan x="42" dy="0">NICE NG3: Diabetes in pregnancy</tspan></text></a><text x="42" y="961" font-size="16" font-weight="400" fill="#526e85"><tspan x="42" dy="0">Teaching revision · 4 October 2026 | OB-GYN Pocketbook · Phichit Hospital</tspan></text></g></svg>