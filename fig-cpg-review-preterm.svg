<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1112" role="img" aria-labelledby="title desc"><title id="title">เจ็บครรภ์ก่อนกำหนด: ประเมินก่อนเลือกยา</title><desc id="desc">ไม่ให้ oral terbutaline maintenance | ไม่ฉีด steroid ซ้ำเป็นกิจวัตรทุกสัปดาห์</desc><rect width="1120" height="1112" rx="20" fill="#f2f7fb"/><g font-family="Tahoma, Leelawadee UI, sans-serif"><text x="42" y="54" font-size="16" font-weight="700" fill="#526e85"><tspan x="42" dy="0">CONFIRM → IDENTIFY RISK → SELECT TREATMENT</tspan></text><text x="42" y="96" font-size="30" font-weight="700" fill="#123d60"><tspan x="42" dy="0">เจ็บครรภ์ก่อนกำหนด: ประเมินก่อนเลือกยา</tspan></text><path d="M42 154 H1078" stroke="#d5e1eb"/><rect x="42.0" y="182" width="1036.0" height="128" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 183 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="218" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">GA &lt;37 สัปดาห์ + contractions / สงสัยน้ำเดิน</tspan></text><text x="62.0" y="262" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ประเมิน cervical change, membrane status, infection, bleeding และ fetal status</tspan></text><path d="M560 310 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="345" width="507.0" height="196" rx="13" fill="#fff8f5" stroke="#dce7ee"/><path d="M57.0 346 H534.0" stroke="#bf5145" stroke-width="4"/><text x="62.0" y="381" font-size="24" font-weight="700" fill="#933d33"><tspan x="62.0" dy="0">มีเหตุให้ต้องคลอด</tspan></text><text x="62.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">เช่น infection, significant abruption หรือ</tspan><tspan x="62.0" dy="34">fetal/maternal compromise: stabilize</tspan><tspan x="62.0" dy="34">และวางแผนคลอด ไม่ยับยั้งเพื่อรอ steroid</tspan></text><rect x="571.0" y="345" width="507.0" height="196" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M586.0 346 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="591.0" y="381" font-size="24" font-weight="700" fill="#17466b"><tspan x="591.0" dy="0">แม่และทารกคงที่</tspan></text><text x="591.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="591.0" dy="0">ปรึกษาสูติฯ/ทารกแรกเกิด เลือกการรักษาตาม GA</tspan><tspan x="591.0" dy="34">และโอกาสคลอดเร็ว</tspan></text><path d="M560 541 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><text x="42" y="593" font-size="19" font-weight="700" fill="#315f7a"><tspan x="42" dy="0">เฉพาะรายที่คงที่และไม่มีข้อบ่งชี้ให้คลอดทันที</tspan></text><rect x="42.0" y="620" width="507.0" height="162" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 621 H534.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="656" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">Steroid เมื่อมีข้อบ่งชี้</tspan></text><text x="62.0" y="700" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">Betamethasone 12 mg IM ทุก 24 ชม. ×2 หรือ</tspan><tspan x="62.0" dy="34">dexamethasone 6 mg IM ทุก 12 ชม. ×4</tspan></text><rect x="571.0" y="620" width="507.0" height="162" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M586.0 621 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="591.0" y="656" font-size="24" font-weight="700" fill="#17466b"><tspan x="591.0" dy="0">Tocolysis / neuroprotection</tspan></text><text x="591.0" y="700" font-size="22" font-weight="400" fill="#344d61"><tspan x="591.0" dy="0">Tocolysis ระยะสั้นในรายที่เหมาะสม; MgSO4 เพื่อ</tspan><tspan x="591.0" dy="34">fetal neuroprotection แยกจากการยับยั้งคลอด</tspan></text><path d="M560 782 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="817" width="1036.0" height="128" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 818 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="853" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">แยกเหตุผลของ antibiotics</tspan></text><text x="62.0" y="897" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">GBS prophylaxis ระหว่างคลอด ≠ latency antibiotics ใน PPROM ≠ treatment of infection</tspan></text><text x="42" y="979" font-size="18" font-weight="400" fill="#4b6477"><tspan x="42" dy="0">ไม่ให้ oral terbutaline maintenance | ไม่ฉีด steroid ซ้ำเป็นกิจวัตรทุกสัปดาห์</tspan></text><a href="https://www.acog.org/clinical/clinical-guidance/committee-opinion/articles/2017/08/antenatal-corticosteroid-therapy-for-fetal-maturation"><text x="42" y="1026" font-size="16" font-weight="400" fill="#2e74b5"><tspan x="42" dy="0">ACOG: Antenatal corticosteroids</tspan></text></a><a href="https://www.nice.org.uk/guidance/ng25/chapter/recommendations"><text x="42" y="1052" font-size="16" font-weight="400" fill="#2e74b5"><tspan x="42" dy="0">NICE NG25: Preterm labour and birth</tspan></text></a><text x="42" y="1078" font-size="16" font-weight="400" fill="#526e85"><tspan x="42" dy="0">Teaching revision · 4 October 2026 | OB-GYN Pocketbook · Phichit Hospital</tspan></text></g></svg>