<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 974" role="img" aria-labelledby="title desc"><title id="title">ผลคัดกรองไทรอยด์ทารกผิดปกติ: ส่งต่อเพื่อยืนยัน</title><desc id="desc">กิ่งตัวเลขจาก CPG เดิมถูกระงับเพื่อรอกุมารแพทย์ต่อมไร้ท่อยืนยัน ใช้ flow นี้เพื่อส่งต่อและติดตาม</desc><rect width="1120" height="974" rx="20" fill="#f2f7fb"/><g font-family="Tahoma, Leelawadee UI, sans-serif"><text x="42" y="54" font-size="16" font-weight="700" fill="#526e85"><tspan x="42" dy="0">SCREEN → CONFIRM → PEDIATRIC PLAN</tspan></text><text x="42" y="96" font-size="30" font-weight="700" fill="#123d60"><tspan x="42" dy="0">ผลคัดกรองไทรอยด์ทารกผิดปกติ: ส่งต่อเพื่อยืนยัน</tspan></text><path d="M42 154 H1078" stroke="#d5e1eb"/><rect x="42.0" y="182" width="1036.0" height="128" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 183 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="218" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">ผล newborn thyroid screening ผิดปกติ</tspan></text><text x="62.0" y="262" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ติดต่อครอบครัวและกุมารแพทย์โดยเร็ว บันทึกอายุทารก เวลาที่เก็บเลือด และผลคัดกรอง</tspan></text><path d="M560 310 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="345" width="1036.0" height="162" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 346 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="381" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">ตรวจ serum TSH + free T4</tspan></text><text x="62.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">แปลผลตามอายุและเกณฑ์ห้องปฏิบัติการ กุมารแพทย์พิจารณาเริ่ม levothyroxine</tspan><tspan x="62.0" dy="34">โดยไม่ให้การส่งต่อล่าช้าขัดขวางการรักษา</tspan></text><path d="M560 507 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="542" width="1036.0" height="128" rx="13" fill="#fff8f5" stroke="#dce7ee"/><path d="M57.0 543 H1063.0" stroke="#bf5145" stroke-width="4"/><text x="62.0" y="578" font-size="24" font-weight="700" fill="#933d33"><tspan x="62.0" dy="0">หาก TSH สูงเล็กน้อย / ผลก้ำกึ่ง</tspan></text><text x="62.0" y="622" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">กุมารแพทย์กำหนดตรวจซ้ำหรือรักษาโดยดู free T4 และแนวโน้ม ไม่หยุดติดตามเพียงจาก TSH &gt;6</tspan></text><path d="M560 670 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="705" width="1036.0" height="128" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 706 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="741" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">ติดตามตามแผนที่กุมารแพทย์รับรอง</tspan></text><text x="62.0" y="785" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">การลด/หยุดยาและประเมิน transient disease เป็นแผนเฉพาะราย ต้องมีวันตรวจซ้ำและผู้รับผิดชอบ</tspan></text><text x="42" y="867" font-size="18" font-weight="400" fill="#4b6477"><tspan x="42" dy="0">กิ่งตัวเลขจาก CPG เดิมถูกระงับเพื่อรอกุมารแพทย์ต่อมไร้ท่อยืนยัน ใช้ flow นี้เพื่อส่งต่อและติดตาม</tspan></text><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/"><text x="42" y="914" font-size="16" font-weight="400" fill="#2e74b5"><tspan x="42" dy="0">ENDO-ERN/ESPE/ESE: Congenital hypothyroidism consensus</tspan></text></a><text x="42" y="940" font-size="16" font-weight="400" fill="#526e85"><tspan x="42" dy="0">Teaching revision · 4 October 2026 | OB-GYN Pocketbook · Phichit Hospital</tspan></text></g></svg>