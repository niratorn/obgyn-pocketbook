<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 832" role="img" aria-labelledby="title desc"><title id="title">CTG: อ่านครบ แล้วแก้สาเหตุที่ย้อนกลับได้</title><desc id="desc">ให้ออกซิเจนเมื่อแม่ hypoxic | Sinusoidal เป็น Category III ได้โดยไม่ต้องมี deceleration ร่วม</desc><rect width="1120" height="832" rx="20" fill="#f2f7fb"/><g font-family="Tahoma, Leelawadee UI, sans-serif"><text x="42" y="54" font-size="16" font-weight="700" fill="#526e85"><tspan x="42" dy="0">CONTEXT → CATEGORY → RESPONSE</tspan></text><text x="42" y="96" font-size="30" font-weight="700" fill="#123d60"><tspan x="42" dy="0">CTG: อ่านครบ แล้วแก้สาเหตุที่ย้อนกลับได้</tspan></text><path d="M42 154 H1078" stroke="#d5e1eb"/><rect x="42.0" y="182" width="1036.0" height="128" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 183 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="218" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">อ่าน baseline, variability, acceleration, deceleration และ UC</tspan></text><text x="62.0" y="262" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ประเมินมารดา ยา GA และการเปลี่ยนแปลงตามเวลา ใช้ระบบ NICHD/ACOG ในตารางนี้</tspan></text><path d="M560 310 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="345" width="507.0" height="196" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 346 H534.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="381" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">Category I</tspan></text><text x="62.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ดูแลและติดตามตามความเสี่ยง</tspan></text><rect x="571.0" y="345" width="507.0" height="196" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M586.0 346 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="591.0" y="381" font-size="24" font-weight="700" fill="#17466b"><tspan x="591.0" dy="0">Category II</tspan></text><text x="591.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="591.0" dy="0">แก้ reversible causes ตามข้อบ่งชี้: ปรับท่า</tspan><tspan x="591.0" dy="34">หยุด/ลด oxytocin เมื่อจำเป็น แก้ hypotension</tspan><tspan x="591.0" dy="34">และประเมินซ้ำ</tspan></text><rect x="42.0" y="563" width="1036.0" height="128" rx="13" fill="#fff8f5" stroke="#dce7ee"/><path d="M57.0 564 H1063.0" stroke="#bf5145" stroke-width="4"/><text x="62.0" y="599" font-size="24" font-weight="700" fill="#933d33"><tspan x="62.0" dy="0">Category III / prolonged bradycardia</tspan></text><text x="62.0" y="643" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">เรียกทีมทันทีและแก้สาเหตุ; หากไม่ตอบสนองให้เร่งคลอดตามสถานการณ์ ไม่รอครบเวลาตายตัว</tspan></text><text x="42" y="725" font-size="18" font-weight="400" fill="#4b6477"><tspan x="42" dy="0">ให้ออกซิเจนเมื่อแม่ hypoxic | Sinusoidal เป็น Category III ได้โดยไม่ต้องมี deceleration ร่วม</tspan></text><a href="https://www.acog.org/clinical/clinical-guidance/clinical-practice-guideline/articles/2025/10/intrapartum-fetal-heart-rate-monitoring-interpretation-and-management"><text x="42" y="772" font-size="16" font-weight="400" fill="#2e74b5"><tspan x="42" dy="0">ACOG 2025: Intrapartum FHR monitoring</tspan></text></a><text x="42" y="798" font-size="16" font-weight="400" fill="#526e85"><tspan x="42" dy="0">Teaching revision · 4 October 2026 | OB-GYN Pocketbook · Phichit Hospital</tspan></text></g></svg>