<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 845" role="img" aria-labelledby="title desc"><title id="title">ป้องกันคลอดก่อนกำหนด: ประวัติร่วมกับ cervical length</title><desc id="desc">17-OHPC ถูกถอนในสหรัฐฯ ปี 2023 และไม่อยู่ในรายการยาที่แนะนำของ flow นี้</desc><rect width="1120" height="845" rx="20" fill="#f2f7fb"/><g font-family="Tahoma, Leelawadee UI, sans-serif"><text x="42" y="54" font-size="16" font-weight="700" fill="#526e85"><tspan x="42" dy="0">HISTORY + TRANSVAGINAL CERVICAL LENGTH</tspan></text><text x="42" y="96" font-size="30" font-weight="700" fill="#123d60"><tspan x="42" dy="0">ป้องกันคลอดก่อนกำหนด: ประวัติร่วมกับ cervical length</tspan></text><path d="M42 154 H1078" stroke="#d5e1eb"/><rect x="42.0" y="182" width="1036.0" height="128" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 183 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="218" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">ทบทวน spontaneous preterm birth เดิม</tspan></text><text x="62.0" y="262" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">แยก singleton/twins และสาเหตุครั้งก่อน; วางแผน TV cervical length ในช่วงกลางครรภ์ตามความเสี่ยง</tspan></text><path d="M560 310 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="345" width="507.0" height="196" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 346 H534.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="381" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">พบ short cervix</tspan></text><text x="62.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ประเมิน vaginal progesterone และ/หรือ cerclage</tspan><tspan x="62.0" dy="34">ตามประวัติ GA และความยาวปากมดลูกกับสูติแพทย์</tspan></text><rect x="571.0" y="345" width="507.0" height="196" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M586.0 346 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="591.0" y="381" font-size="24" font-weight="700" fill="#17466b"><tspan x="591.0" dy="0">มีประวัติ แต่ไม่พบ short cervix</tspan></text><text x="591.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="591.0" dy="0">ACOG ไม่แนะนำ vaginal progesterone เป็น</tspan><tspan x="591.0" dy="34">routine; ปรึกษาแนวทางที่ทีมเลือกเมื่อข้อแนะนำต่า</tspan><tspan x="591.0" dy="34">งกัน</tspan></text><path d="M560 541 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="576" width="1036.0" height="128" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 577 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="612" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">ติดตามและอธิบายอาการเตือน</tspan></text><text x="62.0" y="656" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">น้ำเดิน เจ็บครรภ์สม่ำเสมอ เลือดออก หรือ pelvic pressure ควรกลับมาประเมิน</tspan></text><text x="42" y="738" font-size="18" font-weight="400" fill="#4b6477"><tspan x="42" dy="0">17-OHPC ถูกถอนในสหรัฐฯ ปี 2023 และไม่อยู่ในรายการยาที่แนะนำของ flow นี้</tspan></text><a href="https://www.acog.org/clinical/clinical-guidance/practice-advisory/articles/2023/04/updated-guidance-use-of-progestogen-supplementation-for-prevention-of-recurrent-preterm-birth"><text x="42" y="785" font-size="16" font-weight="400" fill="#2e74b5"><tspan x="42" dy="0">ACOG 2023: Progestogen update</tspan></text></a><text x="42" y="811" font-size="16" font-weight="400" fill="#526e85"><tspan x="42" dy="0">Teaching revision · 4 October 2026 | OB-GYN Pocketbook · Phichit Hospital</tspan></text></g></svg>