<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 985" role="img" aria-labelledby="title desc"><title id="title">PPROM: membrane status เปลี่ยนแผนการดูแล</title><desc id="desc">ก่อน viability: ให้ทีมเฉพาะทางปรึกษาทางเลือก | เมื่อถึง term ใช้แนวทาง term PROM | ประเมิน GBS แยก</desc><rect width="1120" height="985" rx="20" fill="#f2f7fb"/><g font-family="Tahoma, Leelawadee UI, sans-serif"><text x="42" y="54" font-size="16" font-weight="700" fill="#526e85"><tspan x="42" dy="0">CONFIRM ROM → EXCLUDE EMERGENCY → PLAN BY GA</tspan></text><text x="42" y="96" font-size="30" font-weight="700" fill="#123d60"><tspan x="42" dy="0">PPROM: membrane status เปลี่ยนแผนการดูแล</tspan></text><path d="M42 154 H1078" stroke="#d5e1eb"/><rect x="42.0" y="182" width="1036.0" height="128" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 183 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="218" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">สงสัยน้ำเดินก่อน 37 สัปดาห์</tspan></text><text x="62.0" y="262" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ประวัติ + sterile speculum / test ตามข้อบ่งชี้ ลด digital examination ที่ไม่จำเป็น</tspan></text><path d="M560 310 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="345" width="507.0" height="198" rx="13" fill="#fff8f5" stroke="#dce7ee"/><path d="M57.0 346 H534.0" stroke="#bf5145" stroke-width="4"/><text x="62.0" y="381" font-size="24" font-weight="700" fill="#933d33"><tspan x="62.0" dy="0">Infection / abruption / fetal</tspan><tspan x="62.0" dy="36">compromise</tspan></text><text x="62.0" y="461" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">เริ่มรักษาภาวะฉุกเฉินและวางแผนคลอด</tspan><tspan x="62.0" dy="34">ไม่รอให้ครบ steroid หรือ latency course</tspan></text><rect x="571.0" y="345" width="507.0" height="198" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M586.0 346 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="591.0" y="381" font-size="24" font-weight="700" fill="#17466b"><tspan x="591.0" dy="0">ไม่มีภาวะฉุกเฉิน</tspan></text><text x="591.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="591.0" dy="0">ประเมิน GA, fetal status และความพร้อม NICU;</tspan><tspan x="591.0" dy="34">อธิบายทางเลือกกับผู้ป่วย</tspan></text><path d="M560 543 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><text x="42" y="595" font-size="19" font-weight="700" fill="#315f7a"><tspan x="42" dy="0">กรณีไม่มีภาวะฉุกเฉิน: เลือกตามอายุครรภ์</tspan></text><rect x="42.0" y="622" width="507.0" height="196" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 623 H534.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="658" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">ก่อน 34 สัปดาห์</tspan></text><text x="62.0" y="702" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">มัก expectant เมื่อเหมาะสม: steroid + latency</tspan><tspan x="62.0" dy="34">antibiotics + fetal/maternal surveillance;</tspan><tspan x="62.0" dy="34">neuroprotection ตามเกณฑ์</tspan></text><rect x="571.0" y="622" width="507.0" height="196" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M586.0 623 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="591.0" y="658" font-size="24" font-weight="700" fill="#17466b"><tspan x="591.0" dy="0">34 ถึง 36+6 สัปดาห์</tspan></text><text x="591.0" y="702" font-size="22" font-weight="400" fill="#344d61"><tspan x="591.0" dy="0">สูติแพทย์หารือคลอดหรือ expectant เป็นรายคน;</tspan><tspan x="591.0" dy="34">แผน steroid/antibiotics ต้องระบุข้อบ่งชี้</tspan><tspan x="591.0" dy="34">ไม่คัดลอกสูตรก่อน 34 อัตโนมัติ</tspan></text><text x="42" y="852" font-size="18" font-weight="400" fill="#4b6477"><tspan x="42" dy="0">ก่อน viability: ให้ทีมเฉพาะทางปรึกษาทางเลือก | เมื่อถึง term ใช้แนวทาง term PROM | ประเมิน GBS แยก</tspan></text><a href="https://www.nice.org.uk/guidance/ng25/chapter/recommendations"><text x="42" y="899" font-size="16" font-weight="400" fill="#2e74b5"><tspan x="42" dy="0">NICE NG25: Preterm labour and birth</tspan></text></a><a href="https://www.acog.org/clinical/clinical-guidance/committee-opinion/articles/2020/02/prevention-of-group-b-streptococcal-early-onset-disease-in-newborns"><text x="42" y="925" font-size="16" font-weight="400" fill="#2e74b5"><tspan x="42" dy="0">ACOG: Prevention of early-onset GBS</tspan></text></a><text x="42" y="951" font-size="16" font-weight="400" fill="#526e85"><tspan x="42" dy="0">Teaching revision · 4 October 2026 | OB-GYN Pocketbook · Phichit Hospital</tspan></text></g></svg>