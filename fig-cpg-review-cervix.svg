<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 879" role="img" aria-labelledby="title desc"><title id="title">ผลคัดกรองผิดปกติ: แยก AGC จาก squamous abnormalities</title><desc id="desc">Screening ≠ diagnosis | การจัดการต้องดูความเสี่ยงและประวัติ ไม่ใช่ผลครั้งเดียว</desc><rect width="1120" height="879" rx="20" fill="#f2f7fb"/><g font-family="Tahoma, Leelawadee UI, sans-serif"><text x="42" y="54" font-size="16" font-weight="700" fill="#526e85"><tspan x="42" dy="0">RESULT + HISTORY + AGE + PREGNANCY</tspan></text><text x="42" y="96" font-size="30" font-weight="700" fill="#123d60"><tspan x="42" dy="0">ผลคัดกรองผิดปกติ: แยก AGC จาก squamous abnormalities</tspan></text><path d="M42 154 H1078" stroke="#d5e1eb"/><rect x="42.0" y="182" width="1036.0" height="128" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 183 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="218" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">อ่านชนิดผลและประวัติเดิมให้ครบ</tspan></text><text x="62.0" y="262" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">Cytology, HPV genotype/result, อายุ, การตั้งครรภ์ และประวัติ CIN/การรักษา</tspan></text><path d="M560 310 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="345" width="507.0" height="196" rx="13" fill="#fff8f5" stroke="#dce7ee"/><path d="M57.0 346 H534.0" stroke="#bf5145" stroke-width="4"/><text x="62.0" y="381" font-size="24" font-weight="700" fill="#933d33"><tspan x="62.0" dy="0">AGC / AIS</tspan></text><text x="62.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">Colposcopy + endocervical assessment</tspan><tspan x="62.0" dy="34">ในผู้ไม่ตั้งครรภ์; endometrial sampling</tspan><tspan x="62.0" dy="34">ตามอายุ/ความเสี่ยง ไม่ใช้ Pap ซ้ำอย่างเดียว</tspan></text><rect x="571.0" y="345" width="507.0" height="196" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M586.0 346 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="591.0" y="381" font-size="24" font-weight="700" fill="#17466b"><tspan x="591.0" dy="0">ASC-US / LSIL / ASC-H / HSIL</tspan></text><text x="591.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="591.0" dy="0">ใช้ risk-based pathway; ASC-H/HSIL</tspan><tspan x="591.0" dy="34">ต้องประเมินต่อ ไม่ใช้กฎ Pap ทุก 3</tspan><tspan x="591.0" dy="34">เดือนเหมือนกันทั้งหมด</tspan></text><path d="M560 541 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="576" width="507.0" height="162" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 577 H534.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="612" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">มี visible suspicious lesion / symptoms</tspan></text><text x="62.0" y="656" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ประเมินรอยโรคและ biopsy ตามข้อบ่งชี้</tspan><tspan x="62.0" dy="34">ไม่รอรอบคัดกรองปกติ</tspan></text><rect x="571.0" y="576" width="507.0" height="162" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M586.0 577 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="591.0" y="612" font-size="24" font-weight="700" fill="#17466b"><tspan x="591.0" dy="0">ตั้งครรภ์</tspan></text><text x="591.0" y="656" font-size="22" font-weight="400" fill="#344d61"><tspan x="591.0" dy="0">ปรับหัตถการตามข้อจำกัด: ไม่ทำ ECC/endometrial</tspan><tspan x="591.0" dy="34">biopsy; ให้ผู้ชำนาญวางแผน</tspan></text><text x="42" y="772" font-size="18" font-weight="400" fill="#4b6477"><tspan x="42" dy="0">Screening ≠ diagnosis | การจัดการต้องดูความเสี่ยงและประวัติ ไม่ใช่ผลครั้งเดียว</tspan></text><a href="https://pmc.ncbi.nlm.nih.gov/articles/7147428/"><text x="42" y="819" font-size="16" font-weight="400" fill="#2e74b5"><tspan x="42" dy="0">ASCCP: Risk-based management consensus</tspan></text></a><text x="42" y="845" font-size="16" font-weight="400" fill="#526e85"><tspan x="42" dy="0">Teaching revision · 4 October 2026 | OB-GYN Pocketbook · Phichit Hospital</tspan></text></g></svg>