<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1096" role="img" aria-labelledby="title desc"><title id="title">Syphilis ในครรภ์: ยืนยันระยะ รักษาแม่และป้องกันทารก</title><desc id="desc">เขียนหน่วย million units เต็มคำ | ห้ามใช้ mU แทน million units</desc><rect width="1120" height="1096" rx="20" fill="#f2f7fb"/><g font-family="Tahoma, Leelawadee UI, sans-serif"><text x="42" y="54" font-size="16" font-weight="700" fill="#526e85"><tspan x="42" dy="0">TEST → STAGE → PENICILLIN → FOLLOW UP</tspan></text><text x="42" y="96" font-size="30" font-weight="700" fill="#123d60"><tspan x="42" dy="0">Syphilis ในครรภ์: ยืนยันระยะ รักษาแม่และป้องกันทารก</tspan></text><path d="M42 154 H1078" stroke="#d5e1eb"/><rect x="42.0" y="182" width="1036.0" height="128" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 183 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="218" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">ผลคัดกรอง reactive</tspan></text><text x="62.0" y="262" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ทบทวน treponemal test + quantitative RPR/VDRL, อาการ, การรักษาเดิม และความเสี่ยงติดเชื้อซ้ำ</tspan></text><path d="M560 310 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><text x="42" y="362" font-size="19" font-weight="700" fill="#315f7a"><tspan x="42" dy="0">ประเมินข้อจำกัดก่อนเลือกสูตร</tspan></text><rect x="42.0" y="389" width="507.0" height="162" rx="13" fill="#fff8f5" stroke="#dce7ee"/><path d="M57.0 390 H534.0" stroke="#bf5145" stroke-width="4"/><text x="62.0" y="425" font-size="24" font-weight="700" fill="#933d33"><tspan x="62.0" dy="0">แพ้ penicillin</tspan></text><text x="62.0" y="469" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ประเมินการแพ้และ desensitization เพื่อให้</tspan><tspan x="62.0" dy="34">penicillin; ไม่ใช้ erythromycin แทน</tspan></text><rect x="571.0" y="389" width="507.0" height="162" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M586.0 390 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="591.0" y="425" font-size="24" font-weight="700" fill="#17466b"><tspan x="591.0" dy="0">Neuro / ocular / otic symptoms</tspan></text><text x="591.0" y="469" font-size="22" font-weight="400" fill="#344d61"><tspan x="591.0" dy="0">ส่งประเมินเฉพาะทางและใช้ regimen ที่เหมาะสม</tspan><tspan x="591.0" dy="34">ไม่ใช้สูตร latent syphilis แทน</tspan></text><path d="M560 551 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><text x="42" y="603" font-size="19" font-weight="700" fill="#315f7a"><tspan x="42" dy="0">เมื่อไม่มี neuro/ocular/otic disease และสามารถให้ penicillin ได้</tspan></text><rect x="42.0" y="630" width="507.0" height="162" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 631 H534.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="666" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">Early syphilis</tspan></text><text x="62.0" y="710" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">Benzathine penicillin G 2.4 million units IM;</tspan><tspan x="62.0" dy="34">พิจารณา dose เพิ่มในครรภ์ตามแนวทาง</tspan></text><rect x="571.0" y="630" width="507.0" height="162" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M586.0 631 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="591.0" y="666" font-size="24" font-weight="700" fill="#17466b"><tspan x="591.0" dy="0">Late latent / ระยะไม่ทราบ</tspan></text><text x="591.0" y="710" font-size="22" font-weight="400" fill="#344d61"><tspan x="591.0" dy="0">Benzathine penicillin G 2.4 million units IM</tspan><tspan x="591.0" dy="34">ทุกสัปดาห์ ×3; ตรวจวันนัดอย่างเคร่งครัด</tspan></text><path d="M560 792 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="827" width="1036.0" height="128" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 828 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="863" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">ติดตาม titer + คู่นอน + ส่งข้อมูลให้กุมารแพทย์</tspan></text><text x="62.0" y="907" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ไม่ลด 4 เท่าก่อนคลอด ≠ treatment failure โดยลำพัง; ประเมินทารกจากผลตรวจและประวัติแม่ครบชุด</tspan></text><text x="42" y="989" font-size="18" font-weight="400" fill="#4b6477"><tspan x="42" dy="0">เขียนหน่วย million units เต็มคำ | ห้ามใช้ mU แทน million units</tspan></text><a href="https://www.cdc.gov/std/treatment-guidelines/syphilis-pregnancy.htm"><text x="42" y="1036" font-size="16" font-weight="400" fill="#2e74b5"><tspan x="42" dy="0">CDC: Syphilis during pregnancy</tspan></text></a><text x="42" y="1062" font-size="16" font-weight="400" fill="#526e85"><tspan x="42" dy="0">Teaching revision · 4 October 2026 | OB-GYN Pocketbook · Phichit Hospital</tspan></text></g></svg>