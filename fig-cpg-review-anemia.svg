<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 845" role="img" aria-labelledby="title desc"><title id="title">โลหิตจางในครรภ์: หาสาเหตุก่อนเพิ่มธาตุเหล็ก</title><desc id="desc">Folic acid ไม่ใช่ยาทดแทน iron | ตรวจส่วนประกอบของยาวิตามินรวมก่อนสั่งซ้ำ</desc><rect width="1120" height="845" rx="20" fill="#f2f7fb"/><g font-family="Tahoma, Leelawadee UI, sans-serif"><text x="42" y="54" font-size="16" font-weight="700" fill="#526e85"><tspan x="42" dy="0">CBC → CAUSE → TARGETED TREATMENT</tspan></text><text x="42" y="96" font-size="30" font-weight="700" fill="#123d60"><tspan x="42" dy="0">โลหิตจางในครรภ์: หาสาเหตุก่อนเพิ่มธาตุเหล็ก</tspan></text><path d="M42 154 H1078" stroke="#d5e1eb"/><rect x="42.0" y="182" width="1036.0" height="128" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 183 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="218" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">ประเมิน Hb/Hct, MCV และอาการ</tspan></text><text x="62.0" y="262" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ประเมิน bleeding, โภชนาการ, ประวัติครอบครัว/คู่สมรส และความรุนแรง</tspan></text><path d="M560 310 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="345" width="507.0" height="196" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 346 H534.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="381" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">สงสัย iron deficiency</tspan></text><text x="62.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ประเมิน ferritin/iron status ตามบริบท ให้ iron</tspan><tspan x="62.0" dy="34">เมื่อมีข้อบ่งชี้และติดตามการตอบสนอง</tspan></text><rect x="571.0" y="345" width="507.0" height="196" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M586.0 346 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="591.0" y="381" font-size="24" font-weight="700" fill="#17466b"><tspan x="591.0" dy="0">สงสัย thalassemia / สาเหตุอื่น</tspan></text><text x="591.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="591.0" dy="0">Hb typing/partner testing และการตรวจเพิ่มเติมตา</tspan><tspan x="591.0" dy="34">มข้อบ่งชี้ ไม่สรุปว่าเป็น iron deficiency จาก MCV</tspan><tspan x="591.0" dy="34">ต่ำอย่างเดียว</tspan></text><path d="M560 541 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="576" width="1036.0" height="128" rx="13" fill="#fff8f5" stroke="#dce7ee"/><path d="M57.0 577 H1063.0" stroke="#bf5145" stroke-width="4"/><text x="62.0" y="612" font-size="24" font-weight="700" fill="#933d33"><tspan x="62.0" dy="0">อาการรุนแรง / Hb ต่ำมาก / ไม่ตอบสนอง</tspan></text><text x="62.0" y="656" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ปรึกษาสูติฯ/อายุรแพทย์เพื่อวางแผน IV iron, transfusion หรือการรักษาจำเพาะตามผู้ป่วย</tspan></text><text x="42" y="738" font-size="18" font-weight="400" fill="#4b6477"><tspan x="42" dy="0">Folic acid ไม่ใช่ยาทดแทน iron | ตรวจส่วนประกอบของยาวิตามินรวมก่อนสั่งซ้ำ</tspan></text><a href="https://www.who.int/tools/elena/interventions/daily-iron-pregnancy"><text x="42" y="785" font-size="16" font-weight="400" fill="#2e74b5"><tspan x="42" dy="0">WHO: Iron and folic acid in pregnancy</tspan></text></a><text x="42" y="811" font-size="16" font-weight="400" fill="#526e85"><tspan x="42" dy="0">Teaching revision · 4 October 2026 | OB-GYN Pocketbook · Phichit Hospital</tspan></text></g></svg>