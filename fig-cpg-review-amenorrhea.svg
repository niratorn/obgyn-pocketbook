<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 923" role="img" aria-labelledby="title desc"><title id="title">ขาดประจำเดือน: เริ่มจาก pregnancy test</title><desc id="desc">เดิมสม่ำเสมอ: ขาด &gt;3 เดือน | เดิมไม่สม่ำเสมอ: ขาด 6 เดือน</desc><rect width="1120" height="923" rx="20" fill="#f2f7fb"/><g font-family="Tahoma, Leelawadee UI, sans-serif"><text x="42" y="54" font-size="16" font-weight="700" fill="#526e85"><tspan x="42" dy="0">PREGNANCY → HORMONES → TARGETED WORKUP</tspan></text><text x="42" y="96" font-size="30" font-weight="700" fill="#123d60"><tspan x="42" dy="0">ขาดประจำเดือน: เริ่มจาก pregnancy test</tspan></text><path d="M42 154 H1078" stroke="#d5e1eb"/><rect x="42.0" y="182" width="1036.0" height="128" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 183 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="218" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">ประจำเดือนขาด / สงสัยตั้งครรภ์</tspan></text><text x="62.0" y="262" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ตรวจ pregnancy test ก่อน ไม่ต้องรอครบเกณฑ์ secondary amenorrhea</tspan></text><path d="M560 310 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="345" width="507.0" height="196" rx="13" fill="#fff8f5" stroke="#dce7ee"/><path d="M57.0 346 H534.0" stroke="#bf5145" stroke-width="4"/><text x="62.0" y="381" font-size="24" font-weight="700" fill="#933d33"><tspan x="62.0" dy="0">Pregnancy test positive</tspan></text><text x="62.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ประเมินอายุและตำแหน่งครรภ์;</tspan><tspan x="62.0" dy="34">ปวดท้อง/เลือดออก/ไม่คงที่ให้ประเมิน ectopic</tspan><tspan x="62.0" dy="34">เร่งด่วน</tspan></text><rect x="571.0" y="345" width="507.0" height="196" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M586.0 346 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="591.0" y="381" font-size="24" font-weight="700" fill="#17466b"><tspan x="591.0" dy="0">Pregnancy test negative</tspan></text><text x="591.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="591.0" dy="0">ประวัติยา น้ำหนัก การกิน ออกกำลังกาย stress +</tspan><tspan x="591.0" dy="34">ตรวจร่างกาย; TSH, prolactin, FSH ± estradiol</tspan></text><path d="M560 541 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><text x="42" y="593" font-size="19" font-weight="700" fill="#315f7a"><tspan x="42" dy="0">เมื่อผล pregnancy test เป็นลบ</tspan></text><rect x="42.0" y="620" width="1036.0" height="162" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 621 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="656" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">แปลผลตามสาเหตุ</tspan></text><text x="62.0" y="700" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">แยก ovarian insufficiency, hypothalamic/pituitary causes, PCOS และ uterine/outflow pathology;</tspan><tspan x="62.0" dy="34">ultrasound/ตรวจเพิ่มเติมตามข้อบ่งชี้</tspan></text><text x="42" y="816" font-size="18" font-weight="400" fill="#4b6477"><tspan x="42" dy="0">เดิมสม่ำเสมอ: ขาด &gt;3 เดือน | เดิมไม่สม่ำเสมอ: ขาด 6 เดือน</tspan></text><a href="https://www.asrm.org/practice-guidance/practice-committee-documents/current-evaluation-of-amenorrhea/"><text x="42" y="863" font-size="16" font-weight="400" fill="#2e74b5"><tspan x="42" dy="0">ASRM 2024: Amenorrhea</tspan></text></a><text x="42" y="889" font-size="16" font-weight="400" fill="#526e85"><tspan x="42" dy="0">Teaching revision · 4 October 2026 | OB-GYN Pocketbook · Phichit Hospital</tspan></text></g></svg>