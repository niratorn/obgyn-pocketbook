<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 879" role="img" aria-labelledby="title desc"><title id="title">ครรภ์เลยกำหนด: ใช้อายุครรภ์ที่ประเมินดีที่สุด</title><desc id="desc">ลูกดิ้นลดลง น้ำเดิน หรือเลือดออก: มาประเมินทันที ไม่รอตามนัด</desc><rect width="1120" height="879" rx="20" fill="#f2f7fb"/><g font-family="Tahoma, Leelawadee UI, sans-serif"><text x="42" y="54" font-size="16" font-weight="700" fill="#526e85"><tspan x="42" dy="0">DATE → DISCUSS → DOCUMENT</tspan></text><text x="42" y="96" font-size="30" font-weight="700" fill="#123d60"><tspan x="42" dy="0">ครรภ์เลยกำหนด: ใช้อายุครรภ์ที่ประเมินดีที่สุด</tspan></text><path d="M42 154 H1078" stroke="#d5e1eb"/><rect x="42.0" y="182" width="1036.0" height="128" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 183 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="218" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">ยืนยัน best obstetric estimate</tspan></text><text x="62.0" y="262" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ใช้ข้อมูล ultrasound แรกและประวัติ ไม่เลื่อนกำหนดคลอดจาก ultrasound ปลายครรภ์เพียงอย่างเดียว</tspan></text><path d="M560 310 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="345" width="507.0" height="196" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 346 H534.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="381" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">ประมาณ 41 สัปดาห์</tspan></text><text x="62.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">หารือ induction, ประโยชน์/ความเสี่ยง</tspan><tspan x="62.0" dy="34">และความต้องการผู้ป่วย ประเมิน cervix และ fetal</tspan><tspan x="62.0" dy="34">wellbeing</tspan></text><rect x="571.0" y="345" width="507.0" height="196" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M586.0 346 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="591.0" y="381" font-size="24" font-weight="700" fill="#17466b"><tspan x="591.0" dy="0">Dating ไม่แน่นอน</tspan></text><text x="591.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="591.0" dy="0">ให้สูติแพทย์กำหนดแผนตามข้อมูลที่ดีที่สุด</tspan><tspan x="591.0" dy="34">ไม่ใช้ความไม่แน่นอนเป็นเหตุให้รอถึง 44 สัปดาห์</tspan></text><path d="M560 541 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="576" width="1036.0" height="162" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 577 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="612" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">จัดทำแผนชัดเจนก่อน 42 สัปดาห์</tspan></text><text x="62.0" y="656" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ถ้ายังเลือก expectant ต้องมีการติดตามและเกณฑ์กลับมาทันที; monitoring ไม่รับประกันว่าจะป้องกันทุก</tspan><tspan x="62.0" dy="34">adverse outcome</tspan></text><text x="42" y="772" font-size="18" font-weight="400" fill="#4b6477"><tspan x="42" dy="0">ลูกดิ้นลดลง น้ำเดิน หรือเลือดออก: มาประเมินทันที ไม่รอตามนัด</tspan></text><a href="https://www.nice.org.uk/guidance/ng207/chapter/Recommendations"><text x="42" y="819" font-size="16" font-weight="400" fill="#2e74b5"><tspan x="42" dy="0">NICE NG207: Inducing labour</tspan></text></a><text x="42" y="845" font-size="16" font-weight="400" fill="#526e85"><tspan x="42" dy="0">Teaching revision · 4 October 2026 | OB-GYN Pocketbook · Phichit Hospital</tspan></text></g></svg>