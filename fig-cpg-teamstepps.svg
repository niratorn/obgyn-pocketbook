<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1094" role="img" aria-labelledby="title desc"><title id="title">ตกเลือดหลังคลอด: เริ่มหลายมาตรการพร้อมกัน</title><desc id="desc">Methergine หลีกเลี่ยงใน hypertension | TXA เป็นยาช่วยห้ามเลือด ไม่ใช่ uterotonic</desc><rect width="1120" height="1094" rx="20" fill="#f2f7fb"/><g font-family="Tahoma, Leelawadee UI, sans-serif"><text x="42" y="54" font-size="16" font-weight="700" fill="#526e85"><tspan x="42" dy="0">RECOGNIZE → RESUSCITATE → CONTROL</tspan></text><text x="42" y="96" font-size="30" font-weight="700" fill="#123d60"><tspan x="42" dy="0">ตกเลือดหลังคลอด: เริ่มหลายมาตรการพร้อมกัน</tspan></text><path d="M42 154 H1078" stroke="#d5e1eb"/><rect x="42.0" y="182" width="1036.0" height="128" rx="13" fill="#fff8f5" stroke="#dce7ee"/><path d="M57.0 183 H1063.0" stroke="#bf5145" stroke-width="4"/><text x="62.0" y="218" font-size="24" font-weight="700" fill="#933d33"><tspan x="62.0" dy="0">เลือดออกมาก ต่อเนื่อง หรือเริ่มมี hemodynamic compromise</tspan></text><text x="62.0" y="262" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">เรียกสูติแพทย์ วิสัญญี ทีมพยาบาล และธนาคารเลือดทันที ประเมินเลือดออกสะสมและสัญญาณชีพ</tspan></text><path d="M560 310 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="345" width="507.0" height="196" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 346 H534.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="381" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">กู้ชีพและติดตาม</tspan></text><text x="62.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">IV ใหญ่ 2 เส้น, warmed isotonic crystalloid</tspan><tspan x="62.0" dy="34">ตามภาวะ, CBC/coagulation/fibrinogen,</tspan><tspan x="62.0" dy="34">crossmatch, urine output</tspan></text><rect x="571.0" y="345" width="507.0" height="196" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M586.0 346 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="591.0" y="381" font-size="24" font-weight="700" fill="#17466b"><tspan x="591.0" dy="0">เริ่มห้ามเลือด</tspan></text><text x="591.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="591.0" dy="0">นวดมดลูก + oxytocin เมื่อ atony; TXA ภายใน 3</tspan><tspan x="591.0" dy="34">ชั่วโมงหลังคลอด และตรวจหาสาเหตุไปพร้อมกัน</tspan></text><path d="M560 541 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="576" width="507.0" height="162" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 577 H534.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="612" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">TONE / TRAUMA</tspan></text><text x="62.0" y="656" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">มดลูกนิ่ม: uterotonics ± bimanual compression;</tspan><tspan x="62.0" dy="34">แผลฉีกขาด: ตรวจและซ่อมแซม</tspan></text><rect x="571.0" y="576" width="507.0" height="162" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M586.0 577 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="591.0" y="612" font-size="24" font-weight="700" fill="#17466b"><tspan x="591.0" dy="0">TISSUE / THROMBIN</tspan></text><text x="591.0" y="656" font-size="22" font-weight="400" fill="#344d61"><tspan x="591.0" dy="0">รกค้าง: เอาออกโดยทีมที่พร้อม; coagulopathy:</tspan><tspan x="591.0" dy="34">แก้ตามผลตรวจและ massive transfusion protocol</tspan></text><path d="M560 738 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="773" width="1036.0" height="128" rx="13" fill="#fff8f5" stroke="#dce7ee"/><path d="M57.0 774 H1063.0" stroke="#bf5145" stroke-width="4"/><text x="62.0" y="809" font-size="24" font-weight="700" fill="#933d33"><tspan x="62.0" dy="0">เลือดยังออก / ผู้ป่วยไม่คงที่</tspan></text><text x="62.0" y="853" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">Escalate ทันที: balloon เมื่อเหมาะสม, OR, embolization/ผ่าตัดตามทรัพยากร อย่ารอให้ยาครบทุกตัว</tspan></text><text x="42" y="935" font-size="18" font-weight="400" fill="#4b6477"><tspan x="42" dy="0">Methergine หลีกเลี่ยงใน hypertension | TXA เป็นยาช่วยห้ามเลือด ไม่ใช่ uterotonic</tspan></text><a href="https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=17ee0c79-ac98-4400-ae77-985978fca07e"><text x="42" y="982" font-size="16" font-weight="400" fill="#2e74b5"><tspan x="42" dy="0">DailyMed: Methylergonovine</tspan></text></a><a href="https://base-donnees-publique.medicaments.gouv.fr/medicament/61722693/extrait"><text x="42" y="1008" font-size="16" font-weight="400" fill="#2e74b5"><tspan x="42" dy="0">ANSM: Nalador 500 micrograms</tspan></text></a><a href="https://www.ncbi.nlm.nih.gov/books/NBK493076/?report=reader"><text x="42" y="1034" font-size="16" font-weight="400" fill="#2e74b5"><tspan x="42" dy="0">WHO: Tranexamic acid for PPH</tspan></text></a><text x="42" y="1060" font-size="16" font-weight="400" fill="#526e85"><tspan x="42" dy="0">Teaching revision · 4 October 2026 | OB-GYN Pocketbook · Phichit Hospital</tspan></text></g></svg>