<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 905" role="img" aria-labelledby="title desc"><title id="title">ความดันสูงในครรภ์: ตัดสินใจจากความรุนแรง</title><desc id="desc">MgSO4 ใช้กันชัก; ไม่ใช่ยาลดความดัน | ปริมาณ proteinuria ไม่ใช้แบ่ง severe features</desc><rect width="1120" height="905" rx="20" fill="#f2f7fb"/><g font-family="Tahoma, Leelawadee UI, sans-serif"><text x="42" y="54" font-size="16" font-weight="700" fill="#526e85"><tspan x="42" dy="0">ASSESS → STABILIZE → PLAN BIRTH</tspan></text><text x="42" y="96" font-size="30" font-weight="700" fill="#123d60"><tspan x="42" dy="0">ความดันสูงในครรภ์: ตัดสินใจจากความรุนแรง</tspan></text><path d="M42 154 H1078" stroke="#d5e1eb"/><rect x="42.0" y="182" width="1036.0" height="128" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 183 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="218" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">วัด BP ให้ถูกต้องและประเมินแม่กับทารก</tspan></text><text x="62.0" y="262" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ทบทวน GA, อาการ, BP ซ้ำ, CBC/platelets, creatinine, AST/ALT และ urine protein</tspan></text><path d="M560 310 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="345" width="507.0" height="162" rx="13" fill="#fff8f5" stroke="#dce7ee"/><path d="M57.0 346 H534.0" stroke="#bf5145" stroke-width="4"/><text x="62.0" y="381" font-size="24" font-weight="700" fill="#933d33"><tspan x="62.0" dy="0">SBP ≥160 หรือ DBP ≥110</tspan></text><text x="62.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">หากคงอยู่ประมาณ 15 นาที: แจ้งทีมและเริ่มยาลดคว</tspan><tspan x="62.0" dy="34">ามดันโดยเร็ว ภายใน 30-60 นาที ไม่รอ proteinuria</tspan></text><rect x="571.0" y="345" width="507.0" height="162" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M586.0 346 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="591.0" y="381" font-size="24" font-weight="700" fill="#17466b"><tspan x="591.0" dy="0">BP ยังไม่ถึง severe range</tspan></text><text x="591.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="591.0" dy="0">ค้นหา severe features ของอวัยวะ</tspan><tspan x="591.0" dy="34">เพราะอาจมีได้แม้ BP ไม่ถึง 160/110</tspan></text><path d="M560 507 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="542" width="507.0" height="196" rx="13" fill="#fff8f5" stroke="#dce7ee"/><path d="M57.0 543 H534.0" stroke="#bf5145" stroke-width="4"/><text x="62.0" y="578" font-size="24" font-weight="700" fill="#933d33"><tspan x="62.0" dy="0">มี severe features / eclampsia</tspan></text><text x="62.0" y="622" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">MgSO4 ป้องกันหรือรักษาชัก +</tspan><tspan x="62.0" dy="34">ยาลดความดันเมื่อเข้าเกณฑ์ +</tspan><tspan x="62.0" dy="34">ประเมินการคลอดหลัง stabilize</tspan></text><rect x="571.0" y="542" width="507.0" height="196" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M586.0 543 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="591.0" y="578" font-size="24" font-weight="700" fill="#17466b"><tspan x="591.0" dy="0">ไม่มี severe features</tspan></text><text x="591.0" y="622" font-size="22" font-weight="400" fill="#344d61"><tspan x="591.0" dy="0">วางแผนติดตามแม่/ทารกและการคลอดตาม GA;</tspan><tspan x="591.0" dy="34">gestational HT / preeclampsia</tspan><tspan x="591.0" dy="34">มักวางแผนคลอดตั้งแต่ 37 สัปดาห์</tspan></text><text x="42" y="772" font-size="18" font-weight="400" fill="#4b6477"><tspan x="42" dy="0">MgSO4 ใช้กันชัก; ไม่ใช่ยาลดความดัน | ปริมาณ proteinuria ไม่ใช้แบ่ง severe features</tspan></text><a href="https://www.acog.org/community/districts-and-sections/district-ii/programs-and-resources/safe-motherhood-initiative/severe-hypertension"><text x="42" y="819" font-size="16" font-weight="400" fill="#2e74b5"><tspan x="42" dy="0">ACOG: Severe hypertension bundle</tspan></text></a><a href="https://www.acog.org/womens-health/faqs/preeclampsia-and-high-blood-pressure-during-pregnancy"><text x="42" y="845" font-size="16" font-weight="400" fill="#2e74b5"><tspan x="42" dy="0">ACOG: Preeclampsia</tspan></text></a><text x="42" y="871" font-size="16" font-weight="400" fill="#526e85"><tspan x="42" dy="0">Teaching revision · 4 October 2026 | OB-GYN Pocketbook · Phichit Hospital</tspan></text></g></svg>