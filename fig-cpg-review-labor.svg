<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 845" role="img" aria-labelledby="title desc"><title id="title">Labor progress: ช้าไม่เท่ากับ arrest เสมอไป</title><desc id="desc">กราฟ Friedman/เส้น alert เดิมใช้เรียนประวัติได้ แต่ไม่ใช่ข้อบ่งชี้ C/S โดยอัตโนมัติ</desc><rect width="1120" height="845" rx="20" fill="#f2f7fb"/><g font-family="Tahoma, Leelawadee UI, sans-serif"><text x="42" y="54" font-size="16" font-weight="700" fill="#526e85"><tspan x="42" dy="0">PHASE → CONTRACTIONS → REASSESS</tspan></text><text x="42" y="96" font-size="30" font-weight="700" fill="#123d60"><tspan x="42" dy="0">Labor progress: ช้าไม่เท่ากับ arrest เสมอไป</tspan></text><path d="M42 154 H1078" stroke="#d5e1eb"/><rect x="42.0" y="182" width="1036.0" height="128" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 183 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="218" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">ประเมินแม่ ทารก และระยะคลอด</tspan></text><text x="62.0" y="262" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ดู cervical change, contraction, membranes, position/descent, bladder และ analgesia</tspan></text><path d="M560 310 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="345" width="507.0" height="196" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 346 H534.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="381" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">Cervix &lt;6 cm</tspan></text><text x="62.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">ยังไม่ใช้เกณฑ์ active-phase arrest ของ ACOG;</tspan><tspan x="62.0" dy="34">ประเมิน latent phase และข้อบ่งชี้อื่น</tspan></text><rect x="571.0" y="345" width="507.0" height="196" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M586.0 346 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="591.0" y="381" font-size="24" font-weight="700" fill="#17466b"><tspan x="591.0" dy="0">Cervix ≥6 cm + ROM</tspan></text><text x="591.0" y="425" font-size="22" font-weight="400" fill="#344d61"><tspan x="591.0" dy="0">ไม่มี cervical change แม้ UC เพียงพอ ≥4 ชม.</tspan><tspan x="591.0" dy="34">หรือไม่เพียงพอร่วมกับ oxytocin ≥6 ชม.: พิจารณา</tspan><tspan x="591.0" dy="34">active-phase arrest</tspan></text><path d="M560 541 v18 m-6 -6 l6 6 6 -6" fill="none" stroke="#7896ac" stroke-width="2"/><rect x="42.0" y="576" width="1036.0" height="128" rx="13" fill="#ffffff" stroke="#dce7ee"/><path d="M57.0 577 H1063.0" stroke="#3d799b" stroke-width="4"/><text x="62.0" y="612" font-size="24" font-weight="700" fill="#17466b"><tspan x="62.0" dy="0">เรียกอาจารย์ก่อนสรุป CPD / เลือก operative birth</tspan></text><text x="62.0" y="656" font-size="22" font-weight="400" fill="#344d61"><tspan x="62.0" dy="0">พิจารณาการเปลี่ยนแปลงจริง ความปลอดภัยและความเหมาะสมรายบุคคล; ส่งต่อเร็วได้เมื่อทรัพยากรจำกัด</tspan></text><text x="42" y="738" font-size="18" font-weight="400" fill="#4b6477"><tspan x="42" dy="0">กราฟ Friedman/เส้น alert เดิมใช้เรียนประวัติได้ แต่ไม่ใช่ข้อบ่งชี้ C/S โดยอัตโนมัติ</tspan></text><a href="https://www.acog.org/clinical/clinical-guidance/clinical-practice-guideline/articles/2024/01/first-and-second-stage-labor-management"><text x="42" y="785" font-size="16" font-weight="400" fill="#2e74b5"><tspan x="42" dy="0">ACOG 2024: First and second stage labor</tspan></text></a><text x="42" y="811" font-size="16" font-weight="400" fill="#526e85"><tspan x="42" dy="0">Teaching revision · 4 October 2026 | OB-GYN Pocketbook · Phichit Hospital</tspan></text></g></svg>